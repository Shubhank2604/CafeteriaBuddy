name: Feature request
description: Propose a focused product or engineering improvement
title: "[Feature]: "
body:
  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What user or engineering problem should this solve?
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: Proposed approach
      description: Describe the behavior rather than only the implementation.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Trade-offs and alternatives
      description: What complexity, reliability, privacy, or safety implications should be considered?
  - type: checkboxes
    id: safety
    attributes:
      label: Safety check
      options:
        - label: This proposal preserves deterministic allergy and hard-avoid decisions.
          required: true
