name: Bug report
description: Report reproducible incorrect or unexpected behavior
title: "[Bug]: "
body:
  - type: markdown
    attributes:
      value: Thanks for helping improve CafeteriaBuddy. Do not include secrets, personal data, or private menu images.
  - type: textarea
    id: problem
    attributes:
      label: What happened?
      description: Describe the observed behavior and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Reproduction steps
      placeholder: |
        1. Configure...
        2. Open...
        3. Observe...
    validations:
      required: true
  - type: dropdown
    id: area
    attributes:
      label: Affected area
      options:
        - Web application
        - OCR and parsing
        - Food matching and safety rules
        - AI enrichment
        - Documentation or setup
        - Other
    validations:
      required: true
  - type: textarea
    id: environment
    attributes:
      label: Environment
      description: Include operating system and Node.js/Python versions when relevant.
  - type: textarea
    id: evidence
    attributes:
      label: Sanitized logs or screenshots
      description: Remove credentials, personal preferences, and private menu content.
