name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  python:
    name: Python tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      OCR_PROVIDER: local
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Run test suite
        run: python -m pytest -q

  web:
    name: Web tests, lint, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      AUTH_SECRET: ci-only-secret-never-use-in-production
      ADMIN_EMAIL: ci.admin@example.com
      ADMIN_PASSWORD: ci-only-password
      DATABASE_PATH: ./data/ci-menu-match.db
      DIGEST_SCHEDULER: "0"
      OCR_PROVIDER: local
      LLM_PROVIDER: stub
      EMBEDDING_PROVIDER: local
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test

      - name: Run lint
        run: npm run lint

      - name: Build production bundle
        run: npm run build
